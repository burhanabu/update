name: build
on: workflow_dispatch
jobs:
  win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          pip install -r requirements.txt pyinstaller
          pip install --no-deps git+https://github.com/myshell-ai/OpenVoice.git
      - run: >
          pyinstaller --noconfirm --onedir --name AccentLivePro
          --add-data "index.html;."
          --collect-all openvoice --collect-all kokoro_onnx --collect-all espeakng_loader
          --collect-all onnxruntime --collect-all sounddevice --collect-all _sounddevice_data
          --collect-all librosa --collect-all wavmark --collect-all eng_to_ipa --collect-all pypinyin
          --collect-all jieba --collect-all cn2an --collect-all unidecode --collect-all inflect
          app.py
      - run: |
          copy README.txt dist\AccentLivePro\
          mkdir dist\AccentLivePro\models
      - uses: actions/upload-artifact@v4
        with:
          name: AccentLivePro-windows
          path: dist/AccentLivePro
