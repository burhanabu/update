name: build
on: workflow_dispatch
jobs:
  win:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller
      - name: Install app libraries
        run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-deps git+https://github.com/myshell-ai/OpenVoice.git
          python -m pip install wavmark || echo "wavmark skipped (optional)"
      - name: Build app
        run: |
          python -m PyInstaller --noconfirm --onedir --name AccentLivePro \
            --add-data "index.html;." \
            --collect-all openvoice --collect-all kokoro_onnx --collect-all espeakng_loader \
            --collect-all onnxruntime --collect-all sounddevice --collect-all _sounddevice_data \
            --collect-all librosa --collect-all eng_to_ipa --collect-all pypinyin \
            --collect-all jieba --collect-all cn2an --collect-all unidecode --collect-all inflect \
            app.py
      - name: Add readme and models folder
        run: |
          cp README.txt dist/AccentLivePro/
          mkdir -p dist/AccentLivePro/models
      - uses: actions/upload-artifact@v4
        with:
          name: AccentLivePro-windows
          path: dist/AccentLivePro
